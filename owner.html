<title>PowerBlade Owner Panel</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#31572C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: one-column field app — PowerBlade green header, scrolling cards, 5-tab thumb bar; brand: green #31572C, navy #192A3D, gold #FCB816 */
:root{
  --bg:#f4f4f4; --surface:#fff; --fg:#192a3d; --muted:#444f5c; --line:#d3d8dd;
  --turf:#31572c; --turf-ink:#fff; --blade:#fcb816; --blade-ink:#192a3d; --navy:#192a3d;
  --ok:#31572c; --warn:#9a5600; --due:#b3261e; --exp:#8a5a12;
  --f-display:"Jost","Trebuchet MS",Arial,sans-serif;
  --f-body:"Roboto",system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a26; --surface:#192a3d; --fg:#f1f4f7; --muted:#b8c3cf; --line:#2c4058;
  --turf:#5e9a55; --turf-ink:#08140a; --blade:#fcb816; --blade-ink:#192a3d; --navy:#0b1520;
  --ok:#8fd184; --warn:#ffbe5c; --due:#ff8a80; --exp:#f2b866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a26; --surface:#192a3d; --fg:#f1f4f7; --muted:#b8c3cf; --line:#2c4058;
  --turf:#5e9a55; --turf-ink:#08140a; --blade:#fcb816; --blade-ink:#192a3d; --navy:#0b1520;
  --ok:#8fd184; --warn:#ffbe5c; --due:#ff8a80; --exp:#f2b866; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:400 19px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--turf)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto;box-sizing:border-box}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--turf);color:var(--turf-ink)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logochip{background:#fff;border-radius:8px;padding:5px 8px;flex:none;display:flex;align-items:center;border-bottom:3px solid var(--blade)}
.logochip img{height:30px;width:auto;display:block}
.logochip .wordmark{display:none;font:800 italic 22px/1 var(--f-display);letter-spacing:.02em}
.logochip .wordmark b{color:#192a3d}.logochip .wordmark i{color:#fcb816;-webkit-text-stroke:1px #192a3d}
.logochip.nologo img{display:none}.logochip.nologo .wordmark{display:block}
h1{font:700 24px/1 var(--f-display);letter-spacing:.01em;margin:0;flex:1;min-width:0;text-align:right}
h1 small{display:block;font:600 14px/1.2 var(--f-body);letter-spacing:.08em;opacity:.9}
main{padding-block:16px calc(120px + env(safe-area-inset-bottom,0px))}
h2{font:800 28px/1.1 var(--f-display);text-transform:uppercase;margin:22px 0 10px;letter-spacing:.02em;text-wrap:balance}
h3{font:700 19px/1.2 var(--f-body);margin:8px 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.alert{border-color:var(--due)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.example{border-style:dashed}
.card.running{border-color:var(--blade);box-shadow:0 0 0 2px var(--blade) inset}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.name{font:700 21px/1.2 var(--f-body);overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:17px;overflow-wrap:anywhere}
.price{font:800 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pill{font:700 14px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:7px 10px;border-radius:99px;border:2px solid currentColor;white-space:nowrap}
.pill.scheduled{color:var(--warn)} .pill.done{color:var(--due)} .pill.paid{color:var(--ok)} .pill.lead{color:var(--warn)} .pill.due{color:var(--due)}
.tag{font-size:14px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
button,.btn{font:700 18px/1 var(--f-body);min-height:52px;padding:0 16px;border-radius:10px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
.primary{background:var(--blade);color:var(--blade-ink);border-color:var(--blade)}
.go{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
button.small,.btn.small{min-height:46px;font-size:16px;padding:0 12px}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:disabled{opacity:.5}
:focus-visible{outline:4px solid var(--blade);outline-offset:2px}
.full{width:100%}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:17px}
input,select,textarea{font:400 20px/1.3 var(--f-body);min-height:54px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);box-sizing:border-box;width:100%}
textarea{min-height:90px}
form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 92px 96px 46px;gap:6px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px}
.item input,.item select{min-height:46px;font-size:17px;padding:6px 8px}
.item .x{min-height:46px;padding:0;font-size:22px}
.item .lbl{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.total{background:var(--fg);color:var(--bg);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.total .line{display:flex;justify-content:space-between;font-size:17px}
.total .big{display:flex;justify-content:space-between;align-items:center}
.total .big b{font:800 44px/1 var(--f-display);color:var(--blade)}
.hint{color:var(--muted);font-size:16px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.note{background:var(--surface);border-left:6px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{flex-direction:column;gap:2px;min-height:70px;padding:4px 0;font-size:14px;border-width:2px}
.week button b{font:800 24px/1 var(--f-display)}
.week button i{font-style:normal;font-size:13px;color:inherit;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.answer{white-space:pre-wrap;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:18px}
.clover-fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:7;width:76px;height:76px;border-radius:50%;padding:0;border:3px solid var(--blade);background:#0d0d0d;box-shadow:0 8px 20px rgba(0,0,0,.35);overflow:hidden}
.clover-fab .helper{width:100%;height:100%}
.cl-head{display:flex;gap:12px;align-items:center}.cl-head>div{flex:1;min-width:0}
.helper{display:block;border-radius:50%;object-fit:cover;flex:none}
.helper.mono{display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a0d0d,#0d0d0d 70%);color:var(--blade);font:800 italic 1em var(--f-display);letter-spacing:.02em;box-shadow:inset 0 0 0 3px #b3261e}
.cl-head .helper{border:3px solid var(--blade)}
@media (prefers-reduced-motion:no-preference){.helper.live{animation:ready 3.2s ease-in-out infinite}@keyframes ready{0%,100%{box-shadow:0 0 0 0 rgba(252,184,22,0)}50%{box-shadow:0 0 0 6px rgba(252,184,22,.35)}}}
.cl-log{display:flex;flex-direction:column;gap:10px;max-height:44vh;overflow:auto;margin:14px 0;padding:4px}
.cl-msg{padding:12px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;font-size:19px;line-height:1.45}
.cl-msg.bot{background:var(--surface);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.cl-msg.me{background:var(--turf);color:var(--turf-ink);align-self:flex-end;border-bottom-right-radius:4px}
#clMic.live{background:#b3261e;border-color:#b3261e;color:#fff}
.cl-msg.think{color:var(--muted);font-style:italic}
.cl-sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.cl-sugg button{white-space:nowrap}
.cl-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bigacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.bigacts button{min-height:96px;flex-direction:column;gap:6px;font-size:18px;border-radius:16px}
.bigacts button span{font-size:30px;line-height:1}
.bigacts .edit{grid-column:1/-1;min-height:74px;flex-direction:row;font-size:20px;background:var(--navy);color:#fff;border-color:var(--navy)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
nav button{border:none;flex-direction:column;gap:4px;min-height:64px;font-size:14px;padding:0;background:none;border-radius:10px}
nav button[aria-current="page"]{background:var(--turf);color:var(--turf-ink)}
nav svg{width:26px;height:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px))}
.morebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.morebox button{min-height:90px;flex-direction:column;font-size:17px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}.item{grid-template-columns:1fr 70px 84px 44px}.stat b{font-size:26px}}
</style>

<header><div class="wrap">
  <span class="logochip"><img id="brandlogo" src="logo.webp" alt="PowerBlade Lawn Care" onerror="this.parentNode.classList.add('nologo')"><span class="wordmark" aria-hidden="true"><b>POWER</b><i>BLADE</i></span></span>
  <h1 id="bizname">Owner Panel<small>Making Lawns Loveable</small></h1>
</div></header>

<main class="wrap" id="view"></main>

<nav><div class="wrap" id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Today</button>
  <button data-tab="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Schedule</button>
  <button data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/></svg>Clients</button>
  <button data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Money</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 6h16M4 12h16M4 18h16"/></svg>More</button>
</div></nav>

<script>
/* ===== Service catalog: type area = $/sq ft with minimum, flat = per visit, unit = per qty ===== */
const DEFAULT_SERVICES = [
  {k:"mow",label:"Mow",type:"area",rate:.007,min:35,cat:"Lawn"},
  {k:"edge",label:"Edge",type:"flat",rate:15,cat:"Lawn"},
  {k:"trim",label:"String trim",type:"flat",rate:15,cat:"Lawn"},
  {k:"blow",label:"Blow off",type:"flat",rate:10,cat:"Lawn"},
  {k:"fert",label:"Fertilize",type:"area",rate:.005,min:55,cat:"Treatment"},
  {k:"weedctl",label:"Weed control spray",type:"area",rate:.004,min:45,cat:"Treatment"},
  {k:"aerate",label:"Core aeration",type:"area",rate:.006,min:75,cat:"Treatment"},
  {k:"seed",label:"Overseed",type:"area",rate:.008,min:90,cat:"Treatment"},
  {k:"leaves",label:"Leaf removal",type:"area",rate:.01,min:60,cat:"Seasonal"},
  {k:"gutter",label:"Gutter cleaning",type:"flat",rate:95,cat:"Seasonal"},
  {k:"wash",label:"Pressure washing (per sq ft)",type:"unit",rate:.25,unit:"sq ft",cat:"Seasonal"},
  {k:"hedges",label:"Hedge trimming",type:"flat",rate:45,cat:"Landscape"},
  {k:"weeds",label:"Bed weeding",type:"flat",rate:30,cat:"Landscape"},
  {k:"mulch",label:"Mulch (per yard)",type:"unit",rate:75,unit:"yd",cat:"Landscape"},
  {k:"sod",label:"Sod install (per sq ft)",type:"unit",rate:1.75,unit:"sq ft",cat:"Landscape"},
  {k:"plant",label:"Plant install (each)",type:"unit",rate:25,unit:"plant",cat:"Landscape"},
  {k:"design",label:"Bed design / landscaping",type:"flat",rate:350,cat:"Landscape"},
  {k:"treetrim",label:"Tree trimming (per tree)",type:"unit",rate:150,unit:"tree",cat:"Trees & hauling"},
  {k:"brush",label:"Tree & brush removal",type:"flat",rate:250,cat:"Trees & hauling"},
  {k:"junk",label:"Junk removal (per load)",type:"unit",rate:175,unit:"load",cat:"Trees & hauling"},
  {k:"hoa",label:"HOA / commercial common area (per visit)",type:"area",rate:.004,min:150,cat:"Commercial"},
  {k:"custom",label:"Custom item",type:"flat",rate:0,cat:"Other"}
];
const EXP_CATS=["Fuel","Equipment","Materials","Repairs","Labor","Insurance","Marketing","Other"];
const PAY_METHODS=["Cash","Card","Zelle","Cash App","Venmo","Check"];

/* ===== helpers ===== */
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round((+n||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const niceDate=iso=>new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const mapsLink=a=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(a);
const routeLink=addrs=>{const d=addrs[addrs.length-1],w=addrs.slice(0,-1);return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(d)+(w.length?"&waypoints="+encodeURIComponent(w.join("|")):"")};
const svcs=()=>{const o=(state.settings.rates||{});return DEFAULT_SERVICES.map(s=>({...s,...(o[s.k]||{})}))};
const svc=k=>svcs().find(s=>s.k===k)||{label:k,type:"flat",rate:0};
function linePrice(it,sqft){const s=svc(it.k);if(it.k==="custom")return +it.price||0;
  if(s.type==="area")return Math.round(Math.max(s.min||0,(+sqft||0)*s.rate));
  if(s.type==="unit")return Math.round((+it.qty||0)*s.rate*100)/100;return s.rate}
function totals(items,disc,taxPct){const sub=items.reduce((t,i)=>t+(+i.price||0),0);const d=+disc||0;const tax=Math.round((sub-d)*(+taxPct||0))/100;return{sub,disc:d,tax,total:Math.max(0,sub-d+tax)}}
const jobTotal=j=>j.total!=null?+j.total:(+j.price||0);
const mins=j=>Math.round((j.minutes||0)+(j.startedAt?(Date.now()-j.startedAt)/60000:0));

/* ===== state + storage (cloud db, else this device) ===== */
const state={clients:[],jobs:[],expenses:[],equipment:[],crew:[],settings:{},tab:"today",loaded:false,cloud:false,offline:false,day:todayISO(),cfilter:"active"};
const COLS=["clients","jobs","expenses","equipment","crew"];
let db=null,assets=null,sampleFn=null,downloads=null;
const local={read(k,d){try{return JSON.parse(localStorage.getItem("pblc_"+k))??d}catch(e){return d}},write(k,v){try{localStorage.setItem("pblc_"+k,JSON.stringify(v))}catch(e){}}};
async function save(col,id,data){
  if(db){await db.collection(col).doc(id).set(data);return}
  const a=local.read(col,[]).filter(x=>x.id!==id);a.push({...data,id});local.write(col,a);state[col]=a;render()}
async function remove(col,id){
  if(db){await db.collection(col).doc(id).delete();return}
  const a=local.read(col,[]).filter(x=>x.id!==id);local.write(col,a);state[col]=a;render()}
async function saveSettings(s){
  if(db){await db.doc("settings/main").set(s);return}
  local.write("settings",s);state.settings=s;render()}
const clean=o=>{const c={...o};delete c.id;delete c.example;return c};
async function guard(p,ok){try{await p;ok&&toast(ok)}catch(e){toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old records to add more.":"Couldn't save. Check your connection and try again.")}}

async function boot(){
  render();
  const timer=setTimeout(()=>{if(!state.confirmed){state.offline=true;state.loaded=true;render()}},10000);
  const fallback=()=>{clearTimeout(timer);if(!local.read("seeded",false)){seedDemo();local.write("seeded",true)}COLS.forEach(c=>state[c]=local.read(c,[]));state.demo=state.clients.some(c=>c.example);state.settings=local.read("settings",{});state.loaded=true;render()};
  if(!window.claude){fallback();return}
  db=await window.claude.use("db");
  if(!db){fallback();return}
  state.cloud=true;let fresh=0;
  const done=()=>{if(++fresh>=COLS.length+1){clearTimeout(timer);state.confirmed=true;state.offline=false}};
  COLS.forEach(col=>{let f=false;db.collection(col).onSnapshot(s=>{state[col]=s.docs.map(d=>({...d.data(),id:d.id}));if(!s.metadata.fromCache&&!f){f=true;done()}state.loaded=true;render()},()=>{clearTimeout(timer);state.loaded=true;state.offline=true;render()})});
  let fs=false;db.doc("settings/main").onSnapshot(s=>{state.settings=s.exists?s.data():{};if(!s.metadata.fromCache&&!fs){fs=true;done()}render()},()=>{});
  window.claude.use("assets").then(a=>{assets=a});
  window.claude.use("sample").then(s=>{sampleFn=s;if(state.tab==="more")render()});
  window.claude.use("downloads").then(d=>{downloads=d});
}

/* ===== ui plumbing ===== */
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function sheet(html,mount){const s=document.createElement("div");s.className="sheet";s.innerHTML=`<div class="panel"><div class="wrap">${html}</div></div>`;
  s.addEventListener("click",e=>{if(e.target===s||e.target.closest("[data-close]"))s.remove()});document.body.appendChild(s);mount&&mount(s);return s}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copied. Paste it into a text or email.")}
  catch(e){sheet(`<h2>Copy this</h2><textarea id="cp" readonly style="min-height:220px">${esc(text)}</textarea><button class="full" data-close>Close</button>`,s=>{const t=s.querySelector("#cp");t.focus();t.select()})}}
function armed(btn,label,fn){let a=false;btn.onclick=()=>{if(!a){a=true;btn.textContent=label;setTimeout(()=>{a=false},4000);return}fn()}}
const biz=()=>state.settings.name||"PowerBlade Lawn Care";
const DEF={phone:"(615) 587-2226",email:"PowerBladeLawncare@gmail.com",area:"Gallatin · Hendersonville · Nashville, TN"};
function statusNote(){
  if(!state.loaded)return `<div class="empty">Loading your business…</div>`;
  if(state.offline)return `<p class="note">Can't reach your saved data right now. What you see may be out of date.</p>`;
  if(!state.cloud)return state.demo?`<p class="note">Demo mode: sample customers shown with dashed borders. Clear them in More → Business &amp; rates.</p>`:"";return ""}

/* ===== job card ===== */
function jobCard(j,opts={}){
  const items=(j.items||[]).map(i=>`<span class="tag">${esc(i.k==="custom"?(i.label||"Custom"):svc(i.k).label)}${i.qty&&svc(i.k).type==="unit"?" ×"+i.qty:""}</span>`).join(" ");
  const run=!!j.startedAt,m=mins(j);
  const next=j.status==="scheduled"?`<button class="go small" data-act="done" data-id="${j.id}">Mark done</button>`:j.status==="done"?`<button class="primary small" data-act="pay" data-id="${j.id}">Record payment</button>`:"";
  const timer=j.status==="scheduled"?`<button class="small" data-act="timer" data-id="${j.id}" aria-pressed="${run}">${run?"Stop timer":"Start timer"}</button>`:"";
  return `<div class="card${j.example?" example":""}${run?" running":""}">
    <div class="row"><div class="grow"><div class="name">${esc(j.clientName||"Walk-up job")}</div>
      <div class="sub">${niceDate(j.date)}${j.repeat&&j.repeat!=="none"?" · "+j.repeat:""}${j.crew?" · "+esc(j.crew):""}${j.example?" · example":""}</div></div>
      <div class="price">${money(jobTotal(j))}</div></div>
    ${j.address?`<div class="sub">${esc(j.address)}</div>`:""}
    ${items?`<div class="row">${items}</div>`:""}
    ${j.notes?`<div class="sub">📝 ${esc(j.notes)}</div>`:""}
    ${(j.photos||[]).length?`<div class="photos">${j.photos.map(p=>`<img src="/_blob/${esc(p)}" alt="Job photo">`).join("")}</div>`:""}
    <div class="row"><span class="pill ${j.status}">${j.status==="done"?"Owed":j.status==="paid"?"Paid"+(j.paidMethod?" · "+esc(j.paidMethod):""):"Scheduled"}</span>
      ${m?`<span class="tag">⏱ ${Math.floor(m/60)}h ${m%60}m</span>`:""}<span class="grow"></span>
      ${opts.order?`<button class="small" data-act="up" data-id="${j.id}" aria-label="Move up">▲</button><button class="small" data-act="down" data-id="${j.id}" aria-label="Move down">▼</button>`:""}</div>
    <div class="row">${j.address?`<a class="btn small" href="${mapsLink(j.address)}" target="_blank" rel="noopener">Directions</a>`:""}
      ${timer}<button class="small" data-act="textjob" data-id="${j.id}">Text</button><button class="small" data-act="invoice" data-id="${j.id}">Invoice</button><button class="small" data-act="edit" data-id="${j.id}">Edit</button>${next}</div>
  </div>`}

/* ===== views ===== */
function vToday(){
  const t=todayISO(),wk=addDays(t,-6);
  const todays=state.jobs.filter(j=>j.date===t&&j.status==="scheduled").sort((a,b)=>(a.order??a.created??0)-(b.order??b.created??0));
  const owed=state.jobs.filter(j=>j.status==="done");
  const late=state.jobs.filter(j=>j.status==="scheduled"&&j.date<t);
  const weekPaid=state.jobs.filter(j=>j.status==="paid"&&(j.paidOn||j.date)>=wk).reduce((s,j)=>s+jobTotal(j),0);
  const dueEq=state.equipment.filter(e=>(+e.hours||0)-(+e.lastService||0)>=(+e.interval||50));
  const addrs=todays.map(j=>j.address).filter(Boolean);
  const dayValue=todays.reduce((s,j)=>s+jobTotal(j),0);
  return `${statusNote()}
  <div class="stats">
    <div class="stat"><b>${todays.length}</b><span>Stops · ${money(dayValue)}</span></div>
    <div class="stat${owed.length?" alert":""}"><b>${money(owed.reduce((s,j)=>s+jobTotal(j),0))}</b><span>Owed to you</span></div>
    <div class="stat"><b>${money(weekPaid)}</b><span>Paid 7 days</span></div>
  </div>
  <div class="bigacts">
    <button class="edit" data-act="go-site"><span>✏️</span> Edit my website</button>
    <button class="primary" data-act="new"><span>➕</span>New job</button>
    <button class="go" data-act="quote"><span>🧾</span>Estimate</button>
    <button data-act="clover"><span>🥷🏾</span>Ask ${esc(BOT_NAME())}</button>
    <button data-act="go-crew"><span>👷🏾</span>My crew</button>
  </div>
  ${dueEq.length?`<p class="note">Maintenance due: ${dueEq.map(e=>esc(e.name)).join(", ")}. Open More → Equipment.</p>`:""}
  <h2>Today's route · ${niceDate(t)}</h2>
  ${todays.length?`<div class="grid2" style="margin-bottom:12px">${addrs.length?`<a class="btn go" href="${routeLink(addrs)}" target="_blank" rel="noopener">Start route (${addrs.length} stops)</a>`:"<span></span>"}<button id="rain">Rain delay → tomorrow</button></div><div class="grid2" style="margin-bottom:12px"><button data-act="go-crew">Text crew their routes</button><button data-act="textall" data-k="rain">Text today's clients</button></div>`:""}
  <div class="list">${todays.length?todays.map(j=>jobCard(j,{order:true})).join(""):`<div class="empty">No stops today. Add a job or send an estimate.</div>`}</div>
  ${late.length?`<h2>Running late</h2><div class="list">${late.map(j=>jobCard(j)).join("")}</div>`:""}
  ${owed.length?`<h2>Collect payment</h2><div class="list">${owed.map(j=>jobCard(j)).join("")}</div>`:""}
  <p class="hint" style="margin-top:18px">Check the sky first: <a href="https://forecast.weather.gov/MapClick.php?CityName=Gallatin&state=TN" target="_blank" rel="noopener">Gallatin, TN forecast</a>. Tap the mic on your keyboard to talk instead of type.</p>`}

function vSchedule(){
  const d=state.day,start=addDays(d,-((new Date(d+"T12:00:00").getDay()+6)%7));
  const days=[...Array(7)].map((_,i)=>addDays(start,i));
  const count=x=>state.jobs.filter(j=>j.date===x&&j.status==="scheduled").length;
  const list=state.jobs.filter(j=>j.date===d).sort((a,b)=>(a.order??a.created??0)-(b.order??b.created??0));
  const val=list.reduce((s,j)=>s+jobTotal(j),0);
  return `${statusNote()}
  <div class="row" style="margin-bottom:8px"><button class="small" data-act="wk" data-n="-7" aria-label="Previous week">◀ Week</button><span class="grow" style="text-align:center;font-weight:700">${niceDate(start)} – ${niceDate(days[6])}</span><button class="small" data-act="wk" data-n="7" aria-label="Next week">Week ▶</button></div>
  <div class="week">${days.map(x=>`<button data-act="day" data-d="${x}" aria-pressed="${x===d}"><i>${new Date(x+"T12:00:00").toLocaleDateString(undefined,{weekday:"short"})}</i><b>${+x.slice(8)}</b><i>${count(x)||"–"} job${count(x)===1?"":"s"}</i></button>`).join("")}</div>
  <h2>${niceDate(d)} · ${money(val)}</h2>
  <button class="primary full" data-act="new" style="margin-bottom:12px">+ Job on this day</button>
  <div class="list">${list.length?list.map(j=>jobCard(j)).join(""):`<div class="empty">Open day. Good time for a cleanup or install.</div>`}</div>`}

function clientStats(c){const js=state.jobs.filter(j=>j.clientId===c.id);return{visits:js.filter(j=>j.status!=="scheduled").length,paid:js.filter(j=>j.status==="paid").reduce((s,j)=>s+jobTotal(j),0),next:js.filter(j=>j.status==="scheduled").map(j=>j.date).sort()[0]}}

    <div class="sub">${esc(c.address||"No address yet")}${c.lot?` · ${(+c.lot).toLocaleString()} sq ft`:""}</div>

    ${c.notes?`<div class="sub">📝 ${esc(c.notes)}</div>`:""}
    <div class="row">${c.address?`<a class="btn small" href="${mapsLink(c.address)}" target="_blank" rel="noopener">Directions</a>`:""}

      <button class="small" data-act="editclient" data-id="${c.id}">Edit</button></div></div>`}).join(""):`<div class="empty">${f==="leads"?"Log calls and door-knocks here so no lead slips away.":"Add your first client to start scheduling."}</div>`}</div>`}

function monthKey(iso){return iso.slice(0,7)}
function vMoney(){
  const now=todayISO(),mk=monthKey(now);
  const paid=state.jobs.filter(j=>j.status==="paid");
  const rev=m=>paid.filter(j=>monthKey(j.paidOn||j.date)===m).reduce((s,j)=>s+jobTotal(j),0);
  const exp=m=>state.expenses.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+(+e.amount||0),0);
  const owed=state.jobs.filter(j=>j.status==="done").reduce((s,j)=>s+jobTotal(j),0);
  const months=[...Array(6)].map((_,i)=>{const d=new Date(now+"T12:00:00");d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
  const data=months.map(m=>({m,r:rev(m),e:exp(m)}));
  const max=Math.max(100,...data.map(x=>Math.max(x.r,x.e)));
  const W=600,H=230,pl=56,pb=34,pt=14,bw=(W-pl-10)/6;
  const y=v=>H-pb-(v/max)*(H-pb-pt);
  const ticks=[0,max/2,max];
  const chart=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenses, last six months">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+5}" text-anchor="end" font-size="14" fill="var(--muted)">${money(Math.round(t))}</text>`).join("")}
    ${data.map((d,i)=>{const x=pl+i*bw+bw*.14,w=bw*.34;return `<rect x="${x}" y="${y(d.r)}" width="${w}" height="${H-pb-y(d.r)}" fill="var(--turf)" rx="3"/><rect x="${x+w+4}" y="${y(d.e)}" width="${w}" height="${H-pb-y(d.e)}" fill="var(--exp)" rx="3"/><text x="${pl+i*bw+bw/2}" y="${H-10}" text-anchor="middle" font-size="15" fill="var(--fg)" font-weight="700">${new Date(d.m+"-15T12:00:00").toLocaleDateString(undefined,{month:"short"})}</text>`}).join("")}
  </svg>`;
  const ytd=paid.filter(j=>(j.paidOn||j.date).slice(0,4)===now.slice(0,4)).reduce((s,j)=>s+jobTotal(j),0);
  const ytdExp=state.expenses.filter(e=>e.date.slice(0,4)===now.slice(0,4)).reduce((s,e)=>s+(+e.amount||0),0);
  const exps=[...state.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
  const byMethod=PAY_METHODS.map(p=>[p,paid.filter(j=>monthKey(j.paidOn||j.date)===mk&&j.paidMethod===p).reduce((s,j)=>s+jobTotal(j),0)]).filter(x=>x[1]);
  return `${statusNote()}
  <div class="stats">
    <div class="stat"><b>${money(rev(mk))}</b><span>Revenue this month</span></div>
    <div class="stat"><b>${money(exp(mk))}</b><span>Expenses</span></div>
    <div class="stat"><b style="color:${rev(mk)-exp(mk)>=0?"var(--ok)":"var(--due)"}">${money(rev(mk)-exp(mk))}</b><span>Profit</span></div>
    <div class="stat${owed?" alert":""}"><b>${money(owed)}</b><span>Unpaid invoices</span></div>
  </div>
  <h2>Last 6 months</h2>
  <div class="row hint"><span class="tag" style="background:var(--turf);color:var(--turf-ink)">Revenue</span><span class="tag" style="background:var(--exp);color:var(--bg)">Expenses</span></div>
  <div class="chart">${chart}</div>
  <p class="sub">Year to date: ${money(ytd)} in, ${money(ytdExp)} out, ${money(ytd-ytdExp)} profit. Set aside about 25–30% of profit for taxes.</p>
  ${byMethod.length?`<p class="sub">This month by method: ${byMethod.map(([p,v])=>`${p} ${money(v)}`).join(" · ")}</p>`:""}
  <div class="grid2" style="margin-top:12px"><button class="primary" data-act="newexp">+ Expense</button><button data-act="csv">Export CSV</button></div>
  <h2>Expenses</h2>
  <div class="list">${exps.length?exps.map(e=>`<div class="card"><div class="row"><div class="grow"><div class="name">${esc(e.cat)}</div><div class="sub">${niceDate(e.date)}${e.note?" · "+esc(e.note):""}</div></div><div class="price" style="color:var(--exp)">${money(e.amount)}</div><button class="small" data-act="editexp" data-id="${e.id}">Edit</button></div></div>`).join(""):`<div class="empty">Log fuel, blades, mulch and repairs to see real profit.</div>`}</div>`}

let Q={clientId:"",sqft:7000,items:[],disc:0};
function seedQ(){if(!Q.items.length)Q.items=["mow","edge","trim","blow"].map(k=>({k,qty:1}));Q.items.forEach(i=>i.price=linePrice(i,Q.sqft))}
function itemsEditor(items,prefix){
  return `<div class="items" id="${prefix}items">${items.map((it,n)=>{const s=svc(it.k);return `<div class="item" data-n="${n}">
    ${it.k==="custom"?`<input class="${prefix}lbl" value="${esc(it.label||"")}" placeholder="Describe item" aria-label="Item description">`:`<span class="lbl">${esc(s.label)}</span>`}
    ${s.type==="unit"?`<input class="${prefix}qty" type="number" inputmode="decimal" value="${it.qty??1}" aria-label="Quantity">`:`<span class="sub">${s.type==="area"?"by size":"flat"}</span>`}

  <label for="${prefix}add">Add a service<select id="${prefix}add"><option value="">Choose…</option>${[...new Set(svcs().map(s=>s.cat))].map(c=>`<optgroup label="${c}">${svcs().filter(s=>s.cat===c).map(s=>`<option value="${s.k}">${esc(s.label)}</option>`).join("")}</optgroup>`).join("")}</select></label>`}
function totalsBox(t,id){return `<div class="total" id="${id}"><div class="line"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.disc?`<div class="line"><span>Discount</span><span>-${money(t.disc)}</span></div>`:""}${t.tax?`<div class="line"><span>Tax</span><span>${money(t.tax)}</span></div>`:""}<div class="big"><span>Total</span><b>${money(t.total)}</b></div></div>`}

/* ===== Mr. Ed — owner assistant ===== */
const HELPER_IMG=()=>{try{return localStorage.getItem("pb_helperImg")||""}catch(e){return ""}};
const CLOVER_SVG=(size,cls="")=>HELPER_IMG()?`<img class="helper ${cls}" src="${HELPER_IMG()}" alt="" width="${size}" height="${size}">`:`<span class="helper mono ${cls}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.34)}px" aria-hidden="true">Ed</span>`;
const BOT_NAME=()=>state.settings.botName||"Mr. Ed";

/* answers it can give from the owner's own records, exactly */
function cloverData(q){const t=todayISO(),wk=addDays(t,-6),mk=t.slice(0,7);
  const owed=state.jobs.filter(j=>j.status==="done"),today=state.jobs.filter(j=>j.date===t&&j.status==="scheduled");
  const paidM=state.jobs.filter(j=>j.status==="paid"&&(j.paidOn||j.date).slice(0,7)===mk).reduce((s,j)=>s+jobTotal(j),0);
  const expM=state.expenses.filter(e=>e.date.slice(0,7)===mk).reduce((s,e)=>s+(+e.amount||0),0);
  if(/owe|unpaid|collect|outstanding/.test(q))return owed.length?`${owed.length} customer${owed.length>1?"s owe":" owes"} you ${money(owed.reduce((s,j)=>s+jobTotal(j),0))}:\n${owed.map(j=>`• ${j.clientName||"Walk-up"}: ${money(jobTotal(j))} (${niceDate(j.date)})`).join("\n")}\n\nTap Today, then "Record payment" on each one when they pay.`:"Nobody owes you right now. Every finished job is paid.";
  if(/today|schedule|route|stops/.test(q)&&!/how/.test(q))return today.length?`You have ${today.length} stop${today.length>1?"s":""} today worth ${money(today.reduce((s,j)=>s+jobTotal(j),0))}:\n${today.map((j,i)=>`${i+1}. ${j.clientName||"Walk-up"}${j.crew?" ("+j.crew+")":""}`).join("\n")}`:"Nothing is scheduled today.";
  if(/tomorrow/.test(q)){const tm=state.jobs.filter(j=>j.date===addDays(t,1)&&j.status==="scheduled");return tm.length?`Tomorrow: ${tm.map(j=>j.clientName||"Walk-up").join(", ")}.`:"Nothing is scheduled tomorrow yet."}
  if(/(made|earn|revenue|income|profit|this month)/.test(q))return `This month so far: ${money(paidM)} paid in, ${money(expM)} in expenses, so ${money(paidM-expM)} profit. Open the Money tab for the chart.`;
  if(/lead/.test(q)&&/(how many|list|who|new)/.test(q)){const L=state.clients.filter(c=>c.stage==="lead");return L.length?`${L.length} open lead${L.length>1?"s":""}: ${L.map(c=>`${c.name} (${c.leadStatus||"new"})`).join(", ")}. Tap Clients, then Leads.`:"No open leads right now."}
  if(/(how many|number of) (clients|customers)/.test(q))return `You have ${state.clients.filter(c=>c.stage!=="lead").length} clients and ${state.clients.filter(c=>c.stage==="lead").length} leads.`;
  if(/(mower|equipment|service due|oil)/.test(q)&&!/how/.test(q)){const due=state.equipment.filter(e=>(+e.hours||0)-(+e.lastService||0)>=(+e.interval||50));return due.length?`Service is due on: ${due.map(e=>e.name).join(", ")}.`:"All equipment is up to date on service."}
  return null}

/* Middle Tennessee lawn & landscape basics (UT Extension-style guidance) */
const CLOVER_LAWN=[
 [/aerat|overseed|seed/,"In Middle Tennessee most lawns are tall fescue. Core aerate and overseed in early fall, about early September to mid October, when nights cool down. Bermuda and zoysia lawns are aerated in early summer (June–July) while they're actively growing, and aren't overseeded with fescue."],
 [/(how (high|tall|short)|mow(ing)? height|cut height)/,"Tall fescue: mow at 3½–4 inches. Bermuda: 1–2 inches. Zoysia: 1½–2½ inches. Never cut off more than one-third of the grass blade at one time, and keep blades sharp."],
 [/fertiliz|feed/,"Tall fescue is fed mainly in the fall (September and November are the key months), with little or none in summer. Bermuda and zoysia are fed in late spring through summer, about May to August. A soil test through UT Extension tells you exactly what's needed."],
 [/crabgrass|pre.?emergent/,"Put down crabgrass pre-emergent in late winter to early spring, before soil reaches about 55°F (around when forsythia blooms, typically early-to-mid March in Middle Tennessee). Don't use it on areas you plan to seed."],
 [/water/,"Lawns need about 1 inch of water a week, counting rain. Water early in the morning, deeply and less often, so roots grow deep and disease stays down."],
 [/mulch/,"Spread mulch 2–3 inches deep and keep it a few inches away from tree trunks and plant stems. Avoid \"mulch volcanoes\" piled against trunks; they invite rot and pests."],
 [/hedge|shrub|prun/,"Spring-flowering shrubs (like azaleas and forsythia) are pruned right after they bloom. Most hedges are trimmed in late spring and early summer. Avoid heavy pruning from late August on, so new growth can harden before frost."],
 [/leaf|leaves/,"Light leaf cover can be mulch-mowed back into the lawn. Heavy cover should be removed so it doesn't smother the grass, especially on newly seeded fescue."],
 [/sod/,"Sod is best laid when the grass type is actively growing: fescue in fall or spring, bermuda and zoysia in late spring to summer. Water daily for the first two weeks, then taper off as it roots."],
 [/grub|brown patch|disease|fungus/,"Brown patch is common on tall fescue in hot, humid summers; avoid summer fertilizing and evening watering. Grub damage shows as turf that peels up like carpet; treatment timing matters, so check UT Extension guidance or a local turf professional before applying products."],
];
function cloverLocal(q){q=q.toLowerCase();const lawn=(CLOVER_LAWN.find(([r])=>r.test(q))||[])[1],help=(CLOVER_HELP.find(([r])=>r.test(q))||[])[1];
  return cloverData(q)||(/\b(how do i|how to|where|tap|app|button|website)\b/.test(q)?help||lawn:lawn||help)||null}

const NUMW={zero:0,oh:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9};
function voiceAdd(text){const t=text.trim().replace(/[.!?]$/,"");const m=t.match(/^(?:please\s+)?(?:add|new|create|save)\s+(?:a\s+|an\s+)?(?:new\s+)?(client|customer|lead)\s+(?:named\s+|called\s+)?(.+)$/i);if(!m)return null;
  let rest=m[2];const wordsToDigits=x=>x.replace(/\b(zero|oh|one|two|three|four|five|six|seven|eight|nine)\b/gi,w=>NUMW[w.toLowerCase()]);
  let phone="";const pm=wordsToDigits(rest).match(/(?:phone(?: number)?|number|cell)\s*(?:is\s*)?([\d\s().-]{10,})/i)||wordsToDigits(rest).match(/(\d[\d\s().-]{9,}\d)\s*$/);
  if(pm){const d=pm[1].replace(/\D/g,"").slice(-10);if(d.length===10)phone=`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;rest=wordsToDigits(rest).replace(pm[0],"")}
  let address="";const am=rest.match(/\s(?:at|address(?: is)?|lives at|on)\s+(.+?)(?:,?\s+(?:phone|number|cell)\b.*)?$/i);if(am){address=am[1].trim().replace(/[, ]+$/,"").replace(/\b[a-z]/g,c=>c.toUpperCase());rest=rest.slice(0,am.index)}
  const name=rest.replace(/[, ]+$/,"").replace(/\b\w/g,c=>c.toUpperCase()).trim();if(!name)return null;
  return {name,address,phone,stage:/lead/i.test(m[1])?"lead":"active"}}
async function voiceSave(c){const id=newId();await save("clients",id,{...c,source:c.stage==="lead"?"Voice note":"",leadStatus:c.stage==="lead"?"New lead":undefined,created:Date.now()});go();return `Saved ${c.stage==="lead"?"lead":"client"} ${c.name}${c.address?" at "+c.address:""}${c.phone?", phone "+c.phone:""}. You can add more details later in Clients.`}
const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
function speak(t){try{if(!local.read("speak",true)||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[•*]/g,"").replace(/\n+/g,". "));u.rate=1;speechSynthesis.speak(u)}catch(e){}}

async function cloverAsk(q){const code=local.read("aiCode","");
  try{const r=await fetch("api/ask",{method:"POST",headers:{"content-type":"application/json","x-owner-code":code},body:JSON.stringify({question:q,context:cloverContext(),history:cloverHist.slice(-6),name:BOT_NAME()})});

  s.classList.add("cl-sheet");const log=s.querySelector("#clLog"),inp=s.querySelector("#clIn");
  const add=(t,who)=>{const d=document.createElement("div");d.className="cl-msg "+who;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d};
  const ask=async q=>{q=q.trim();if(!q)return;add(q,"me");inp.value="";const w=add("*sharpening my answer…*","bot think");

  if(Rec){let r=null;mic.onclick=()=>{if(r){r.stop();return}r=new Rec();r.lang="en-US";r.interimResults=true;r.maxAlternatives=1;mic.classList.add("live");mic.textContent="● Listening… tap to stop";
    r.onresult=e=>{const t=[...e.results].map(x=>x[0].transcript).join(" ");inp.value=t;if(e.results[e.results.length-1].isFinal){r.stop();ask(t)}};
    r.onerror=e=>{add(e.error==="not-allowed"?"Microphone access is off. Allow the microphone for this site in Chrome's settings, then try again.":"I didn't catch that. Tap the mic and try again.","bot")};
    r.onend=()=>{r=null;mic.classList.remove("live");mic.textContent="🎤 Tap and talk"};r.start()}}
  else mic.onclick=()=>add("Tap the text box, then the 🎤 microphone on your keyboard to talk.","bot");
  s.querySelector("#clForm").onsubmit=e=>{e.preventDefault();ask(inp.value)};

async function exportCSV(){
  const rows=[["Type","Date","Client/Category","Status/Note","Method","Amount"]];
  state.jobs.forEach(j=>rows.push(["Job",j.date,j.clientName||"Walk-up",j.status,j.paidMethod||"",jobTotal(j)]));
  state.expenses.forEach(e=>rows.push(["Expense",e.date,e.cat,e.note||"","",-(+e.amount||0)]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  if(downloads){try{await downloads.save({filename:`pblc-books-${todayISO()}.csv`,data:csv});return}catch(e){if(e&&e.code==="declined")return}}
  copy(csv)}

  document.body.appendChild(o);const i=o.querySelector("#pinin");i.focus();i.oninput=()=>{if(i.value===pin){o.remove();go()}else if(i.value.length>=pin.length)o.querySelector("#pinmsg").textContent="That PIN didn't match. Try again."}})();
boot();
</script>
